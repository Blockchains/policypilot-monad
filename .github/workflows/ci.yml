name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libs (pinned)
        run: |
          git clone --depth 1 --branch v1.17.0 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.7.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: e2e on local anvil
        run: |
          anvil --silent &
          sleep 3
          cd executor && npm ci && OUT=/tmp/e2e.json node e2e-anvil.mjs && cat /tmp/e2e.json
      - name: agent-kit unit tests against anvil
        run: |
          pkill anvil || true; anvil --silent &
          sleep 3
          cd packages/agent-kit && npm ci && npm test
      - name: plugin-eliza type-check
        run: cd packages/plugin-eliza && npm ci && npm run typecheck
      - name: Next.js dashboard unit tests (MonaDefi rules/withdraw math, spend planner) + build (static export)
        run: cd web && npm ci && npx tsc --noEmit && npm test && npm run build
      - name: "Mainnet fork tests (real dapps - WMON, Uniswap, PancakeSwap, Kintsu, aPriori, Magma)"
        continue-on-error: true # public RPC can rate-limit CI; evidence is committed in docs/evidence
        run: forge test --fork-url https://rpc.monad.xyz --match-contract "AgentVaultFork|PolicyPilotSpreadVaultFork|PolicyPilotClipVaultFork" -vv
